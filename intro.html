<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mở đầu - For My Love</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      font-family: Georgia, "TH Cartoon 9", serif;
      color: #562235;
      background:
        radial-gradient(circle at 18% 18%, #ffd6e7 0 8%, transparent 25%),
        radial-gradient(circle at 82% 80%, #ffc9d9 0 8%, transparent 25%),
        linear-gradient(135deg, #fff4f7, #ffe1eb);
    }

    .intro-card {
      width: min(100%, 560px);
      padding: 60px 34px;
      text-align: center;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 20px 60px rgba(126, 42, 76, 0.2);
      backdrop-filter: blur(12px);
      animation: appear 1s ease-out;
    }

    .heart {
      font-size: 64px;
      animation: heartbeat 1.4s infinite;
    }

    h1 {
      margin: 18px 0;
      color: #c5285d;
      font-size: clamp(2rem, 6vw, 3.2rem);
    }

    p {
      line-height: 1.8;
      font-size: 1.1rem;
    }

    .signature {
      color: #b92859;
      font-weight: bold;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      15% {
        transform: scale(1.18);
      }
      30% {
        transform: scale(1);
      }
      45% {
        transform: scale(1.12);
      }
    }
  </style>
</head>

<body>
  <main class="intro-card">
    <div class="heart">🌷</div>
    <h1>Một lời nhắn nhỏ</h1>
    <p>
      Ước gì có em bên cạnh để anh yêu thương và khong để em chịu khổ
    </p>
    <p class="signature">Cảm ơn em vì đã đến bên anh. 💕</p>
  </main>
</body>
</html>
